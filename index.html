const writeRecords=(id,a)=>{try{localStorage.setItem(recordKey(id),JSON.stringify(a));return true}catch(e){alert('無法儲存：瀏覽器可能禁止本機儲存。請嘗試使用 Chrome 或 Safari 開啟檔案。');return false}};
function visible(){const q=$('search').value.trim().toLowerCase();return recipes.filter(r=>(category==='全部'||r.category===category)&&(!q||[r.name,r.category,...r.ingredients].join(' ').toLowerCase().includes(q)))}
function filters(){const cats=['全部','湯品','麵飯主食','肉類','海鮮','蔬菜','蛋豆腐','點心'];$('categories').innerHTML=cats.map(c=>`<button class="chip ${c===category?'active':''}" data-cat="${safe(c)}">${safe(c)}</button>`).join('');document.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{category=b.dataset.cat;filters();});const a=visible();if(!a.some(r=>r.id===selected)&&a.length)selected=a[0].id;$('recipeSelect').innerHTML=a.length?a.map(r=>`<option value="${r.id}">${r.id}｜${safe(r.name)}</option>`).join(''):'<option value="">沒有符合的食譜</option>';$('recipeSelect').disabled=!a.length;if(a.length)$('recipeSelect').value=selected;render()}
function getChecks(){try{return JSON.parse(sessionStorage.getItem('minnie-checks-'+selected)||'{}')}catch{return {}}}
function setCheck(k,v){const c=getChecks();c[k]=v;try{sessionStorage.setItem('minnie-checks-'+selected,JSON.stringify(c))}catch{}}
function render(){const r=recipes.find(x=>x.id===selected);if(!visible().length){$('recipeBody').innerHTML='<p class="empty">目前沒有符合條件的料理，請調整搜尋或分類。</p>';return}if(!r)return;const c=getChecks();editIndex=null;$('recipeBody').innerHTML=`<div class="meta"><span class="overline">RECIPE ${r.id} · ${safe(r.category)}</span><span>◷ ${safe(r.time)}　♧ ${safe(r.servings)}</span></div><h2>${safe(r.name)}</h2><img class="hero" src="${r.image}" alt="${safe(r.name)}實物料理示意照片"><section class="section"><div class="recordtop"><h3>準備食材</h3><div class="controls"><small>字體大小</small><button class="btn" data-size="14">小</button><button class="btn" data-size="16">中</button><button class="btn" data-size="20">大</button></div></div><div class="items sized" style="--recipe-size:${fontSize}px">${r.ingredients.map((s,i)=>`<label class="item"><input type="checkbox" data-check="i${i}" ${c['i'+i]?'checked':''}><span>${safe(s)}</span></label>`).join('')}</div>${r.seasoning?`<h3 style="margin-top:18px">調味料</h3><div class="items sized" style="--recipe-size:${fontSize}px">${r.seasoning.map((s,i)=>`<label class="item"><input type="checkbox" data-check="t${i}" ${c['t'+i]?'checked':''}><span>${safe(s)}</span></label>`).join('')}</div>`:''}</section><section class="section"><h3>料理步驟</h3><ol class="steps sized" style="--recipe-size:${fontSize}px">${r.steps.map((s,i)=>`<li><b class="stepnum">${i+1}</b><label><input type="checkbox" data-check="s${i}" ${c['s'+i]?'checked':''}><span>${safe(s)}</span></label></li>`).join('')}</ol><button id="resetChecks" class="btn" style="margin-top:12px">重設勾選</button></section><section class="section"><h3>💡 米妮的料理小提醒</h3><ul class="tips">${r.tips.map(t=>`<li>${safe(t)}</li>`).join('')}</ul></section><section class="record"><div class="recordtop"><h3>📅 我的料理紀錄</h3><button class="btn primary" id="addRecord">＋ 新增紀錄</button></div><p class="notice">做過的日期、心得、調味調整和下次改進，都可以留在這裡。</p><div id="recordForm" class="hidden"></div><div id="recordList"></div></section>`;document.querySelectorAll('[data-check]').forEach(e=>e.onchange=()=>setCheck(e.dataset.check,e.checked));document.querySelectorAll('[data-size]').forEach(e=>e.onclick=()=>{fontSize=Number(e.dataset.size);document.querySelectorAll('.sized').forEach(el=>el.style.setProperty('--recipe-size',fontSize+'px'))});$('resetChecks').onclick=()=>{try{sessionStorage.removeItem('minnie-checks-'+selected)}catch{}render()};$('addRecord').onclick=()=>showForm();renderRecords()}
function renderRecords(){const arr=readRecords(selected);$('recordList').innerHTML=arr.length?arr.map((e,i)=>`<div class="entry"><div class="entryhead"><b>${safe(e.date)}　<span style="color:#c38a26">${'★'.repeat(Number(e.rating)||0)}${'☆'.repeat(5-(Number(e.rating)||0))}</span></b><span><button class="btn" data-edit="${i}">編輯</button> <button class="btn" data-delete="${i}">刪除</button></span></div>${e.note?`<p><b>料理心得：</b>${safe(e.note)}</p>`:''}${e.seasoning?`<p><b>調味調整：</b>${safe(e.seasoning)}</p>`:''}${e.next?`<p><b>下次改進：</b>${safe(e.next)}</p>`:''}</div>`).join(''):'<p class="empty">還沒有料理紀錄。第一次做完，就來寫下心得吧！</p>';document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>showForm(Number(b.dataset.edit)));document.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>{if(confirm('確定刪除這筆料理紀錄？')){const a=readRecords(selected);a.splice(Number(b.dataset.delete),1);writeRecords(selected,a);renderRecords()}})}
function showForm(index=null){editIndex=index;const e=index===null?{}:readRecords(selected)[index];$('recordForm').classList.remove('hidden');$('recordForm').innerHTML=`<form id="logForm"><div class="formgrid"><label>料理日期<input name="date" type="date" required value="${safe(e.date||new Date().toLocaleDateString('en-CA'))}"></label><label>這次評分<select name="rating">${[5,4,3,2,1].map(n=>`<option value="${n}" ${Number(e.rating||5)===n?'selected':''}>${n} 顆星</option>`).join('')}</select></label><label class="wide">料理心得／口感<textarea name="note" placeholder="例如：雞肉很嫩，湯頭很香">${safe(e.note||'')}</textarea></label><label class="wide">調味調整<textarea name="seasoning" placeholder="例如：醬油減半、少放鹽">${safe(e.seasoning||'')}</textarea></label><label class="wide">下次想改進<textarea name="next" placeholder="例如：蔥花可以再多一點">${safe(e.next||'')}</textarea></label></div><div class="formactions"><button class="btn primary" type="submit">儲存紀錄</button><button class="btn" type="button" id="cancelLog">取消</button></div></form>`;$('cancelLog').onclick=()=>{$('recordForm').classList.add('hidden')};$('logForm').onsubmit=ev=>{ev.preventDefault();const d=new FormData(ev.currentTarget),obj=Object.fromEntries(d.entries()),a=readRecords(selected);if(editIndex===null)a.unshift(obj);else a[editIndex]=obj;if(writeRecords(selected,a)){$('recordForm').classList.add('hidden');renderRecords()}}}
$('recipeSelect').onchange=e=>{selected=e.target.value;render()};$('search').oninput=filters;$('clear').onclick=()=>{category='全部';$('search').value='';filters()};$('export').onclick=()=>{const data={format:'minnie-recipe-records-v1',records:Object.fromEntries(recipes.map(r=>[r.id,readRecords(r.id)]))};const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='minnie_cooking_records.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};$('import').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const d=JSON.parse(await f.text());if(d.format!=='minnie-recipe-records-v1'||!d.records)throw Error('備份格式不符');if(!confirm('匯入會覆蓋這個瀏覽器裡三道料理的現有紀錄，確定嗎？'))return;for(const r of recipes){if(!Array.isArray(d.records[r.id]))continue;writeRecords(r.id,d.records[r.id])}renderRecords();alert('料理紀錄已匯入')}catch(err){alert('匯入失敗：'+err.message)}finally{e.target.value=''}};filters();
</script></body></html>
